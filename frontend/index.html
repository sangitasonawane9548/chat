<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>MELT — Premium Real-Time Messaging & Calling Platform</title>
    <meta name="description" content="MELT is an ultra-fluid, username-driven real-time messaging, audio, and video platform. Stay connected, share moments, and keep conversations flowing." />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Anti-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('melt_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (saved === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-brand-bg text-brand-text font-sans antialiased min-h-screen selection:bg-[#8B5CF6]/30 selection:text-white transition-colors duration-200">
    <div id="root">
      <!-- Fast Pre-React Initial Branding Loader -->
      <div id="initial-melt-loader" style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#0B0D12;color:#ffffff;font-family:sans-serif;flex-direction:column;gap:14px;">
        <div style="width:36px;height:36px;border:3px solid #8B5CF6;border-top-color:transparent;border-radius:50%;animation:melt-spin 0.8s linear infinite;"></div>
        <div style="font-size:12px;font-weight:700;letter-spacing:0.1em;color:#A78BFA;text-transform:uppercase;">Loading MELT...</div>
        <style>@keyframes melt-spin{to{transform:rotate(360deg);}}</style>
      </div>
    </div>
    <!-- Global Script Error Logger to prevent silent blank screens on mobile -->
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-melt-loader');
        if (loader && !window.__melt_mounted) {
          loader.innerHTML = '<div style="max-width:92%;background:#181015;border:1px solid rgba(244,63,94,0.4);border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.6);">' +
            '<div style="color:#F43F5E;font-weight:700;font-size:16px;margin-bottom:8px;">Resource Loading Notice</div>' +
            '<div style="color:#E2E8F0;font-size:12px;line-height:1.5;margin-bottom:12px;">' + (e.message || 'Mobile browser blocked module scripts') + '</div>' +
            '<div style="color:#94A3B8;font-size:11px;margin-bottom:16px;line-height:1.4;">If you opened via HTTPS with self-signed SSL, mobile browsers block sub-resources. Tap below to open via standard HTTP:</div>' +
            '<a href="http://' + window.location.hostname + ':5173" style="display:inline-block;background:linear-gradient(135deg,#8B5CF6,#EC4899);color:white;font-weight:700;padding:10px 20px;border-radius:12px;text-decoration:none;font-size:13px;">Open via HTTP (http://' + window.location.hostname + ':5173)</a>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
